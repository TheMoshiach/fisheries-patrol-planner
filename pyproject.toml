[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patrol-planner"
version = "0.1.0"
description = "Ranks fishing vessels by illegal-fishing risk from Global Fishing Watch data and records patrol decisions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.50", "folium>=0.17", "streamlit-folium>=0.22"]
dev = ["pytest>=8.0"]

[project.scripts]
patrol-planner = "patrol_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
